server {
    listen 80;
    server_name _;

    # Mesa Certa app served at root
    location = / {
        root /usr/share/nginx/mesacerta;
        try_files /index.html =404;
    }

    # Everything else browsable from the full repo
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }
}
